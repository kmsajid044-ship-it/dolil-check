<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>দলিল চেক · সিল সনদ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='6' fill='%232e3c93'/%3E%3Cpath d='M10 16.5l4 4 8-9' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="description" content="দলিল চেক: জমির দলিল যাচাইয়ের প্রোটোটাইপ (LandTech 2026, টিম এন্ট্রপি)। সব তথ্য কাল্পনিক।">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&text=%E0%A7%A6%E0%A7%A7%E0%A7%A8%E0%A7%A9%E0%A7%AA%E0%A7%AB%E0%A7%AC%E0%A7%AD%E0%A7%AE%E0%A7%AF&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script>try{const t=localStorage.getItem("dolil-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>

</head>
<body>
<main id="main"><div class="wrap">
  <div class="buttons noprint" style="margin:32px 0 20px">
    <button type="button" onclick="print()">প্রিন্ট / PDF হিসেবে সেভ</button>
    <a class="btn ghost" id="vlink" href="/v">যাচাই পাতা</a>
  </div>
  <div class="certificate" id="cert"><p>লোড হচ্ছে…</p></div>
</div></main>
<script src="/static/app.js"></script>
<script>
renderHeader("");
const id = new URLSearchParams(location.search).get("id") || "";
$("#vlink").href = "/v?deed=" + encodeURIComponent(id);
(async () => {
  const r = await api("/deeds/" + encodeURIComponent(id));
  if (!r.ok) { $("#cert").innerHTML = `<p>${esc(ERROR_BN[r.data.error] || r.data.message)}</p>`; return; }
  const d = r.data.record;
  $("#cert").innerHTML = `
    <div class="watermark">নমুনা</div>
    <h1>বিক্রয় দলিলের সিল সনদ</h1>
    <div class="sub">দলিল চেক প্রোটোটাইপ · কাল্পনিক তথ্য · ${esc(d.office_id)}</div>
    <div class="split">
      <div>${deedSummaryHtml(d)}</div>
      <div style="text-align:center"><div class="qr"><img src="/deeds/${encodeURIComponent(id)}/qr.png" alt="QR"></div>
        <p style="font-size:13px;margin:6px 0 0">ফোনের ক্যামেরায় স্ক্যান করে<br>যাচাই করুন</p></div>
    </div>
    <h2>ডিজিটাল সিল</h2>
    <table>
      <tr><th>পাবলিক লগ এন্ট্রি</th><td>#${bn(r.data.leaf_index)} (লগে মোট ${bn(r.data.sth.tree_size)})</td></tr>
      <tr><th>রেকর্ড হ্যাশ (SHA-256)</th><td class="mono">${esc(r.data.record_hash)}</td></tr>
      <tr><th>দলিলের ফাইলের ফিঙ্গারপ্রিন্ট</th><td class="mono">${esc(d.doc_sha256 || "—")}</td></tr>
      <tr><th>অফিসের কী</th><td class="mono">${esc(r.data.key_id)} (Ed25519)</td></tr>
      <tr><th>স্বাক্ষর</th><td class="mono">${esc(r.data.signature)}</td></tr>
    </table>
    <p style="font-size:13px;color:#555;margin-bottom:0">এই সনদের কোনো তথ্য বদলালে QR স্ক্যানে তা ধরা পড়বে। একই জমি আবার বিক্রির চেষ্টা নিবন্ধনের সময়ই আটকে যায়।</p>`;
})();
</script>
</body>
</html>
